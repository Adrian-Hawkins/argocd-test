apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-test-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Adrian-Hawkins/argocd-test.git
    targetRevision: HEAD
    path: dev/test-app
  destination: 
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true