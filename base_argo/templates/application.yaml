{{- range $key, $val := .Values.apps }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $key }}-{{ $val.namespace }}
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ $val.repoUrl }}
    targetRevision: HEAD
    path: {{ $val.path }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $val.namespace }}
  syncPolicy:
    syncOptions:
    - CreateNamespace=true


---
{{- end }}